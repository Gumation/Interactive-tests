<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ondeva AI Agent Demo</title>

  <link rel="stylesheet" href="./css/style.css">
</head>

<body>

  <main class="page">

    <section
      class="experience"
      id="experience"
    >

      <canvas
        class="proximity-canvas"
        id="proximityCanvas"
      ></canvas>


      <!-- AI AGENT -->

      <div class="flow-item agent-column">

        <div
          class="agent-node"
          id="agentNode"
        >

          <div class="agent-symbol">
            ✦
          </div>

          <div class="agent-title">
            AI Agent
          </div>

          <div class="prompt-box">

            <span class="prompt-label">
              PROMPT
            </span>

            <div class="prompt-content">

              <span id="promptText"></span>

              <span
                class="prompt-cursor"
                id="promptCursor"
                hidden
              ></span>

            </div>

          </div>

        </div>

      </div>

          </svg>

        </div>

      </div>


      <!-- CAPABILITIES -->

      <div class="flow-item capabilities">

        <button
          class="capability"
          data-capability="database"
        >

          <div class="capability-icon">
            DB
          </div>

          <div class="capability-copy">
            <strong>Database</strong>
            <span>Connected customer data</span>
          </div>

          <div class="capability-action">
            +
          </div>

        </button>


        <button
          class="capability"
          data-capability="workflow"
        >

          <div class="capability-icon">
            WF
          </div>

          <div class="capability-copy">
            <strong>Workflow</strong>
            <span>Automated business processes</span>
          </div>

          <div class="capability-action">
            +
          </div>

        </button>


        <button
          class="capability"
          data-capability="apis"
        >

          <div class="capability-icon">
            API
          </div>

          <div class="capability-copy">
            <strong>APIs</strong>
            <span>Connected external services</span>
          </div>

          <div class="capability-action">
            +
          </div>

        </button>

      </div>


      <!-- RESULT -->

      <div class="flow-item result-column">

        <div
          class="result-card is-loading"
          id="resultCard"
        >

          <div
            class="result-loading"
            id="resultLoading"
          ></div>


          <div
            class="result-content"
            id="resultContent"
          >

            <h2
              class="result-title"
              id="resultTitle"
            >
              Loading result
            </h2>

            <div
              class="result-copy"
              id="resultCopy"
            ></div>

            <div
              class="result-visual"
              id="resultVisual"
            ></div>

          </div>

        </div>

      </div>


      <svg
        class="connections"
        id="connections"
      ></svg>

    </section>

  </main>


  <script src="./js/main.js"></script>

</body>
</html>
